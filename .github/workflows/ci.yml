name: CI Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Force-refresh SDK Manager repository metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.android"
          touch "${HOME}/.android/repositories.cfg"

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager: ${SDKMANAGER}"
          "${SDKMANAGER}" --version || true
          rm -rf "${ANDROID_HOME}/.knownPackages" \
                 "${ANDROID_HOME}/temp" \
                 "${HOME}/.android/cache" || true
          "${SDKMANAGER}" --update || true

      - name: Confirm Android API 37 is available
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi

          "${SDKMANAGER}" --channel=3 --list | tee sdkmanager-packages.txt
          grep -E 'platforms;android-37|platforms;android-37-ext[0-9]+' sdkmanager-packages.txt

      - name: Install Android API 37 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi

          "${SDKMANAGER}" --channel=3 \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "cmake;3.22.1"

      - name: Verify Android API 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME}/platforms/android-37"
          test -d "${ANDROID_HOME}/build-tools/37.0.0"
          test -d "${ANDROID_HOME}/cmake/3.22.1"

      - name: Set up NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

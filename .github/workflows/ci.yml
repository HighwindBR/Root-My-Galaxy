name: CI Build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - '.github/workflows/test-build.yml'
      - '.github/workflows/quick-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: >
            platform-tools
            platforms;android-37.1
            build-tools;37.0.0
            cmake;3.22.1

      - name: Cache NDK r28
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/ndk/r28
          key: ndk-r28

      - name: Set up NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        env:
          GRADLE_OPTS: "-Xmx5g -XX:+HeapDumpOnOutOfMemoryError"
        run: ./gradlew lint --build-cache --parallel --console=plain

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: >
            platform-tools
            platforms;android-37.1
            build-tools;37.0.0
            cmake;3.22.1

      - name: Cache NDK r28
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/ndk/r28
          key: ndk-r28

      - name: Set up NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true

      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Xmx5g -XX:+HeapDumpOnOutOfMemoryError"
        run: ./gradlew assembleDebug --build-cache --parallel --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

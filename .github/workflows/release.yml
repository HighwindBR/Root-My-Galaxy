name: Build & Release
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --install "ndk;28.0.13004108" "cmake;3.22.1" || \
          yes | sdkmanager --install "ndk;28.0.12916984" "cmake;3.22.1"

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/Root-My-Galaxy-${SHORT_SHA}.apk

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/debug/Root-My-Galaxy-${{ env.SHORT_SHA }}.apk"
          name: "Commit: ${{ env.SHORT_SHA }}"
          tag: "${{ env.SHORT_SHA }}"
          commit: ${{ github.sha }}
          body: "Automated build for commit ${{ env.SHORT_SHA }}"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

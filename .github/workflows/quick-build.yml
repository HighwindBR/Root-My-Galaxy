name: Quick Build
# Produces a release APK as fast as possible. Intended for manual
# on-demand builds and pushes to main. Maximises Gradle + SDK caching
# and skips slow SDK Manager verification steps entirely.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: quick-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-build:
    name: Quick Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: >
            platform-tools
            platforms;android-37.1
            build-tools;37.0.0
            cmake;3.22.1

      - name: Set up NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --build-cache --parallel --configuration-cache --console=plain

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-quick-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

name: Quick Build
# Produces a release APK as fast as possible. Intended for manual
# on-demand builds and pushes to main. Maximises Gradle + SDK caching
# and skips slow SDK Manager verification steps entirely.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: quick-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-build:
    name: Quick Build
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ubuntu-latest already ships platform-tools and a base SDK;
      # only install the components that are actually missing.
      - name: Install missing SDK components
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-37" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" 2>/dev/null || true

      - name: Cache NDK r28
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/ndk/r28
          key: ndk-r28-${{ runner.os }}

      - name: Set up NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          local_cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: false

      - name: Build release APK
        env:
          GRADLE_OPTS: "-Xmx5g -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          ./gradlew assembleRelease \
            --build-cache \
            --parallel \
            --configuration-cache \
            --no-daemon \
            -Dkotlin.incremental=false \
            --console=plain

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-quick-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

name: Quick Build
# Produces a release APK as fast as possible. Intended for manual
# on-demand builds and pushes to main. Maximises Gradle + SDK caching
# and skips slow SDK Manager verification steps entirely.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: quick-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-build:
    name: Quick Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NDK_VERSION: r28

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Cache the full NDK tree. On a hit the nttld step is a fast no-op.
      - name: Cache NDK r28
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/ndk/r28
          key: ndk-r28-${{ runner.os }}-v2
          save-always: false

      - name: Set up NDK r28
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          local_cache: true
          add-to-path: false

      - name: Export NDK env vars
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      # ubuntu-latest ships API 35, build-tools 35.0.0, and cmake 3.22.1.
      # Only install what is genuinely missing; skip entirely if all present.
      - name: Install missing SDK components
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          NEED=""
          [[ -d "${ANDROID_SDK_ROOT}/platforms/android-35" ]]  || NEED+=" platforms;android-35"
          [[ -d "${ANDROID_SDK_ROOT}/build-tools/35.0.0" ]]     || NEED+=" build-tools;35.0.0"
          [[ -d "${ANDROID_SDK_ROOT}/cmake/3.22.1" ]]            || NEED+=" cmake;3.22.1"
          if [[ -n "$NEED" ]]; then
            yes | "$SDKMANAGER" $NEED 2>/dev/null || true
          else
            echo "All required SDK components already present, skipping sdkmanager."
          fi

      # Cache the CMake / ninja build output keyed on the native sources.
      # On a warm cache the ExternalNativeBuild task is entirely UP-TO-DATE.
      - name: Cache native build output
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: native-arm64-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**') }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            native-arm64-${{ runner.os }}-
          save-always: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: false

      - name: Build release APK
        env:
          # gradle.properties owns heap + parallelism settings.
          # Only override what the properties file cannot express.
          GRADLE_OPTS: "-XX:+HeapDumpOnOutOfMemoryError"
        run: |
          ./gradlew assembleRelease \
            --build-cache \
            --parallel \
            --configuration-cache \
            --no-daemon \
            --console=plain

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-quick-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

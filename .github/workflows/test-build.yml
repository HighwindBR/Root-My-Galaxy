name: Test Build
# Fast compile check for pull requests — no APK upload, skips all SDK
# install overhead by relying entirely on cached toolchain layers.

on:
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test Build (compile check)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: >
            platform-tools
            platforms;android-37.1
            build-tools;37.0.0
            cmake;3.22.1

      - name: Cache NDK r28
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/ndk/r28
          key: ndk-r28

      - name: Set up NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # compileDebugSources checks all Kotlin/Java + native compile steps
      # without running packaging, signing, or dex merging — fastest possible
      # signal that the code actually compiles.
      - name: Compile sources (no APK)
        env:
          GRADLE_OPTS: "-Xmx5g -XX:+HeapDumpOnOutOfMemoryError"
        run: ./gradlew compileDebugSources --build-cache --parallel --console=plain
